<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Formatter · Cloud Firebase</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/tool.css">
</head>
<body>
  <main class="page">
    <section class="tool-page" aria-labelledby="pageTitle">
      <header class="topbar">
        <a class="brand" href="/get-started/" aria-label="Back to Get Started">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-title">Cloud Firebase</span>
        </a>
        <button class="signout" id="logoutButton" type="button">Sign out</button>
      </header>

      <div class="tool-content">
        <div class="formatter-card">
          <div class="field-group">
            <label for="input">Input</label>
            <textarea id="input" spellcheck="false" placeholder='Paste JSON here…'></textarea>
          </div>

          <div class="formatter-actions">
            <button class="primary" id="formatButton" type="button">Format JSON</button>
            <button class="secondary" id="clearButton" type="button">Clear</button>
          </div>

          <div class="field-group">
            <pre id="output" class="output" aria-live="polite"></pre>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireAuth, logout } from "/assets/js/auth-guard.js";

    const logoutButton = document.getElementById("logoutButton");
    const formatButton = document.getElementById("formatButton");
    const clearButton = document.getElementById("clearButton");
    const input = document.getElementById("input");
    const output = document.getElementById("output");

    let auth = null;

    requireAuth({
      onUser: (_user, authInstance) => {
        auth = authInstance;
        document.body.classList.add("ready");
      }
    });

    logoutButton.addEventListener("click", () => logout(auth, logoutButton));

    formatButton.addEventListener("click", () => {
      const value = input.value.trim();

      if (!value) {
        output.textContent = "Paste JSON into the input area first.";
        output.classList.add("error");
        return;
      }

      try {
        const parsed = JSON.parse(value);
        output.textContent = JSON.stringify(parsed, null, 2);
        output.classList.remove("error");
      } catch (error) {
        output.textContent = `Invalid JSON: ${error.message}`;
        output.classList.add("error");
      }
    });

    clearButton.addEventListener("click", () => {
      input.value = "";
      output.textContent = "";
      output.classList.remove("error");
      input.focus();
    });
  </script>
</body>
</html>

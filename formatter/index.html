<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Formatter · Cloud Firebase</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/tool.css">
</head>
<body>
  <main class="page">
    <section class="tool-page" aria-label="Firebase formatter">
      <header class="topbar">
        <a class="brand" href="/get-started/" aria-label="Back to Get Started">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-title">Cloud Firebase</span>
        </a>
        <a class="signout" href="/get-started/" aria-label="Back to Get Started">← Back</a>
      </header>

      <div class="tool-content formatter-content">
        <div class="formatter-card">
          <div class="formatter-copy">
            <p>Paste a Firebase Web config to convert it to Cloudflare environment variables.</p>
          </div>

          <div class="formatter-actions">
            <button class="primary paste-button" id="pasteButton" type="button">Paste</button>
          </div>

          <pre id="output" class="output" aria-live="polite">Converted values will appear here.</pre>
          <p id="status" class="tool-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireAuth } from "/assets/js/auth-guard.js";

    const pasteButton = document.getElementById("pasteButton");
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    const keys = [
      ["apiKey", "FIREBASE_API_KEY"],
      ["authDomain", "FIREBASE_AUTH_DOMAIN"],
      ["projectId", "FIREBASE_PROJECT_ID"],
      ["storageBucket", "FIREBASE_STORAGE_BUCKET"],
      ["messagingSenderId", "FIREBASE_MESSAGING_SENDER_ID"],
      ["appId", "FIREBASE_APP_ID"]
    ];

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("is-error", isError);
    }

    function extractFirebaseConfig(source) {
      const clean = source
        .replace(/\uFEFF/g, "")
        .replace(/\/\*[\s\S]*?\*\//g, "")
        .replace(/(^|\n)\s*\/\/.*$/gm, "");

      const values = {};

      for (const [key] of keys) {
        const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(
          `(?:["']?${escapedKey}["']?)\\s*:\\s*["']([^"'\\n\\r]*)["']`,
          "m"
        );
        const match = clean.match(pattern);
        if (match) values[key] = match[1].replace(/\\:/g, ":");
      }

      return values;
    }

    function convertFirebaseConfig(source) {
      const values = extractFirebaseConfig(source);
      const missing = keys.filter(([key]) => !values[key]).map(([, envKey]) => envKey);

      if (missing.length) throw new Error(`Missing: ${missing.join(", ")}`);

      return keys.map(([key, envKey]) => `${envKey}=${values[key]}`).join("\n");
    }

    let waitingForManualPaste = false;

    function resetPasteButton() {
      pasteButton.disabled = false;
      pasteButton.textContent = "Paste";
    }

    function showManualPasteFallback(reason = "") {
      waitingForManualPaste = true;
      resetPasteButton();

      const prefix = reason ? `${reason} ` : "";
      setStatus(
        `${prefix}Press Ctrl+V (or ⌘V) now to paste from your clipboard.`,
        true
      );

      window.focus();
      pasteButton.focus();
    }

    function handlePastedText(source) {
      if (!source || !source.trim()) {
        setStatus("Nothing was pasted.", true);
        return;
      }

      try {
        output.textContent = convertFirebaseConfig(source);
        setStatus("Converted successfully.");
      } catch (error) {
        output.textContent = "Converted values will appear here.";
        setStatus(error?.message || "The pasted text is not a valid Firebase Web config.", true);
      }
    }

    async function getClipboardPermissionState() {
      try {
        if (!navigator.permissions?.query) return "unknown";
        const permission = await navigator.permissions.query({ name: "clipboard-read" });
        return permission.state || "unknown";
      } catch {
        return "unknown";
      }
    }

    async function requestClipboardAndConvert() {
      setStatus("");
      pasteButton.disabled = true;
      pasteButton.textContent = "Requesting access…";

      try {
        if (!window.isSecureContext || !navigator.clipboard?.readText) {
          throw new DOMException("Clipboard API unavailable", "NotAllowedError");
        }

        const permissionState = await getClipboardPermissionState();

        // Calling readText() directly from the button click is the browser-supported
        // way to request clipboard-read permission when the state is "prompt".
        pasteButton.textContent = permissionState === "granted"
          ? "Pasting…"
          : "Allow clipboard…";

        const source = await navigator.clipboard.readText();

        waitingForManualPaste = false;
        resetPasteButton();

        if (!source.trim()) {
          setStatus("Your clipboard is empty.", true);
          return;
        }

        handlePastedText(source);
      } catch (error) {
        const name = error?.name || "";

        if (name === "NotAllowedError" || name === "SecurityError" || name === "AbortError") {
          const state = await getClipboardPermissionState();

          if (state === "denied") {
            showManualPasteFallback("Clipboard permission is blocked in this browser.");
          } else {
            showManualPasteFallback("Clipboard permission was not granted.");
          }
          return;
        }

        resetPasteButton();
        showManualPasteFallback("Clipboard access is unavailable.");
      }
    }

    // Keep Ctrl+V / Cmd+V working even when clipboard-read permission is unavailable.
    document.addEventListener("paste", (event) => {
      if (!waitingForManualPaste) return;

      const source = event.clipboardData?.getData("text/plain") || event.clipboardData?.getData("text");
      if (!source) return;

      event.preventDefault();
      waitingForManualPaste = false;
      handlePastedText(source);
    });

    requireAuth({
      onUser: () => document.body.classList.add("ready")
    });

    pasteButton.addEventListener("click", requestClipboardAndConvert);
  </script></body>
</html>

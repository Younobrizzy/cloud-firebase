<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Formatter · Cloud Firebase</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/tool.css">
</head>
<body>
  <main class="page">
    <section class="tool-page" aria-labelledby="pageTitle">
      <header class="topbar">
        <a class="brand" href="/get-started/" aria-label="Back to Get Started">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-title">Cloud Firebase</span>
        </a>
        <a class="signout" href="/get-started/" aria-label="Back to Get Started">← Back</a>
      </header>

      <div class="tool-content">
        <div class="formatter-card">
          <div class="field-group">
            <label for="input">Input</label>
            <textarea id="input" spellcheck="false" placeholder='Paste JSON here…'></textarea>
          </div>

          <div class="formatter-actions">
            <button class="primary" id="formatButton" type="button">Format JSON</button>
            <button class="secondary" id="clearButton" type="button">Clear</button>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireAuth } from "/assets/js/auth-guard.js";

    const formatButton = document.getElementById("formatButton");
    const clearButton = document.getElementById("clearButton");
    const input = document.getElementById("input");

    requireAuth({
      onUser: (_user, authInstance) => {
        document.body.classList.add("ready");
      }
    });


    formatButton.addEventListener("click", () => {
      const value = input.value.trim();

      if (!value) {
        alert("Paste JSON into the input area first.");
        return;
      }

      try {
        const parsed = JSON.parse(value);
        input.value = JSON.stringify(parsed, null, 2);
      } catch (error) {
        alert(`Invalid JSON: ${error.message}`);
      }
    });

    clearButton.addEventListener("click", () => {
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>

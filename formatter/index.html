<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Formatter · Cloud Firebase</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/tool.css">
</head>
<body>
  <main class="page">
    <section class="tool-page" aria-label="Firebase formatter">
      <header class="topbar">
        <a class="brand" href="/get-started/" aria-label="Back to Get Started">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-title">Cloud Firebase</span>
        </a>
        <a class="signout" href="/get-started/" aria-label="Back to Get Started">← Back</a>
      </header>

      <div class="tool-content formatter-content">
        <div class="formatter-card">
          <div class="formatter-copy">
            <p>Paste a Firebase Web config to convert it to Cloudflare environment variables.</p>
          </div>

          <div class="formatter-actions">
            <textarea
              id="pasteField"
              class="paste-field"
              rows="8"
              inputmode="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Firebase environment variables"
              placeholder="Tap and hold to paste your Firebase config"
            ></textarea>
            <button id="copyButton" class="copy-button" type="button" disabled>Copy</button>
          </div>
          <p id="status" class="tool-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireAuth } from "/assets/js/auth-guard.js";

    const pasteField = document.getElementById("pasteField");
    const copyButton = document.getElementById("copyButton");
    const status = document.getElementById("status");

    const keys = [
      ["apiKey", "FIREBASE_API_KEY"],
      ["authDomain", "FIREBASE_AUTH_DOMAIN"],
      ["projectId", "FIREBASE_PROJECT_ID"],
      ["storageBucket", "FIREBASE_STORAGE_BUCKET"],
      ["messagingSenderId", "FIREBASE_MESSAGING_SENDER_ID"],
      ["appId", "FIREBASE_APP_ID"]
    ];

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("is-error", isError);
    }

    function extractFirebaseConfig(source) {
      const clean = source
        .replace(/\uFEFF/g, "")
        .replace(/\/\*[\s\S]*?\*\//g, "")
        .replace(/(^|\n)\s*\/\/.*$/gm, "");

      const values = {};

      for (const [key] of keys) {
        const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp(
          `(?:["']?${escapedKey}["']?)\\s*:\\s*["']([^"'\\n\\r]*)["']`,
          "m"
        );
        const match = clean.match(pattern);
        if (match) values[key] = match[1].replace(/\\:/g, ":");
      }

      return values;
    }

    function convertFirebaseConfig(source) {
      const values = extractFirebaseConfig(source);
      const missing = keys.filter(([key]) => !values[key]).map(([, envKey]) => envKey);

      if (missing.length) throw new Error(`Missing: ${missing.join(", ")}`);

      return keys.map(([key, envKey]) => `${envKey}=${values[key]}`).join("\n");
    }

    function updateCopyState() {
      copyButton.disabled = !pasteField.value.trim();
    }

    function handlePastedText(source) {
      if (!source || !source.trim()) {
        pasteField.value = "";
        updateCopyState();
        setStatus("Nothing was pasted.", true);
        return;
      }

      try {
        const converted = convertFirebaseConfig(source);
        pasteField.value = converted;
        pasteField.scrollTop = 0;
        pasteField.selectionStart = pasteField.selectionEnd = 0;
        updateCopyState();
        setStatus("Converted successfully.");
      } catch (error) {
        pasteField.value = "";
        updateCopyState();
        setStatus(error?.message || "The pasted text is not a valid Firebase Web config.", true);
      }
    }

    // Block manual typing/editing while keeping native paste available on desktop and mobile.
    pasteField.addEventListener("keydown", (event) => {
      const pasteShortcut = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "v";
      const navigation = ["Tab", "Shift", "Control", "Meta", "Alt", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"];
      if (pasteShortcut || navigation.includes(event.key)) return;
      event.preventDefault();
    });

    pasteField.addEventListener("beforeinput", (event) => {
      if (event.inputType === "insertFromPaste") return;
      event.preventDefault();
    });

    // Native paste keeps the mobile long-press paste menu working and also supports Ctrl+V / Cmd+V.
    pasteField.addEventListener("paste", (event) => {
      const source = event.clipboardData?.getData("text/plain") || event.clipboardData?.getData("text") || "";
      event.preventDefault();
      handlePastedText(source);
    });

    // Keep accidental input from changing the converted value.
    pasteField.addEventListener("input", () => {
      updateCopyState();
    });

    pasteField.addEventListener("drop", (event) => {
      event.preventDefault();
    });

    pasteField.addEventListener("dragover", (event) => {
      event.preventDefault();
    });

    copyButton.addEventListener("click", async () => {
      const value = pasteField.value.trim();
      if (!value) return;

      try {
        await navigator.clipboard.writeText(value);
        setStatus("Copied to clipboard.");
      } catch {
        pasteField.focus();
        pasteField.select();
        const copied = document.execCommand("copy");
        pasteField.selectionStart = pasteField.selectionEnd = 0;
        setStatus(copied ? "Copied to clipboard." : "Copy permission was denied.", !copied);
      }
    });

    updateCopyState();

    requireAuth({
      onUser: () => document.body.classList.add("ready")
    });

  </script></body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Firestore · Cloud Firebase</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/tool.css">
</head>
<body>
  <main class="page">
    <section class="tool-page" aria-label="Protected Firestore workspace">
      <header class="topbar">
        <a class="brand" href="/get-started/" aria-label="Back to Get Started">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-title">Cloud Firebase</span>
        </a>
        <a class="signout" href="/get-started/" aria-label="Back to Get Started">← Back</a>
      </header>

      <div class="tool-content">
        <div class="workspace" aria-label="Firestore workspace">
          <div class="workspace-header">
            <span class="status">Protected</span>
          </div>
          <div class="placeholder">
            <strong>Firestore workspace</strong>
            <span>Start building your collections and documents here.</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireAuth } from "/assets/js/auth-guard.js";

    requireAuth({
      onUser: (_user, authInstance) => {
        document.body.classList.add("ready");
      }
    });

  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Firebase</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="page">
    <section class="screen" id="loginView">
      <div class="content">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <span class="brand-title">Cloud Firebase</span>
        </div>

        <h1>Welcome back</h1>

        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="Email" required>

          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>

          <p id="message" class="message" aria-live="polite"></p>

          <button id="loginButton" type="submit">Login</button>
        </form>

        <div class="divider"><span>or</span></div>

        <button id="googleButton" class="google-button" type="button">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.42z"/>
            <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.5z"/>
            <path fill="#FBBC05" d="M6.54 13.6a5.85 5.85 0 0 1 0-3.2V7.87H3.3a9.75 9.75 0 0 0 0 8.26l3.24-2.53z"/>
            <path fill="#EA4335" d="M12 6.37c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.42 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.37l3.24 2.53C7.31 8.09 9.46 6.37 12 6.37z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>
    </section>

    <section class="screen hidden" id="contactView">
      <div class="content">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <span class="brand-title">Cloud Firebase</span>
        </div>

        <h1>Contact</h1>

        <form id="contactForm">
          <label for="name">Name</label>
          <input id="name" type="text" autocomplete="name" placeholder="Name" required>

          <label for="contactEmail">Email</label>
          <input id="contactEmail" type="email" autocomplete="email" placeholder="Email" required>

          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" placeholder="Message" required></textarea>

          <p id="contactStatus" class="message" aria-live="polite"></p>

          <button type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>

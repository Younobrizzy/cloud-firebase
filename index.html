<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <title>JSON Mail — Sign in</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-label="JSON Mail authentication">
      <div class="auth-brand-row">
        <div class="brand-mark">JM</div>
        <div class="brand">JSON Mail</div>
      </div>

      <div class="auth-copy">
        <p class="eyebrow">EMAIL API</p>
        <h1 id="title">Welcome back</h1>
        <p id="subtitle" class="muted">Sign in to manage your SMTP connection and email API.</p>
      </div>

      <form id="authForm" class="auth-form">
        <label for="email">Email
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>

        <label for="password">Password
          <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters">
        </label>

        <button id="submitButton" class="primary-button" type="submit">Sign in</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button id="googleButton" class="google-button" type="button">
        <span class="google-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path fill="#4285F4" d="M21.35 12.18c0-.7-.06-1.36-.18-2H12v3.79h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.18z"/>
            <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.34l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.75 9.75 0 0 0 12 21.5z"/>
            <path fill="#FBBC05" d="M6.53 13.6A5.86 5.86 0 0 1 6.23 12c0-.56.1-1.1.3-1.6V7.87H3.28A9.5 9.5 0 0 0 2.25 12c0 1.53.37 2.98 1.03 4.13l3.25-2.53z"/>
            <path fill="#EA4335" d="M12 6.37c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.45 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.72 5.37l3.25 2.53C7.3 8.09 9.46 6.37 12 6.37z"/>
          </svg>
        </span>
        <span id="googleText">Continue with Google</span>
      </button>

      <button id="modeButton" class="secondary mode-button" type="button">
        Create an account
      </button>

      <p id="message" class="status" aria-live="polite"></p>

      <p class="auth-footnote">Your SMTP password is encrypted before it is stored.</p>
    </section>
  </main>

  <script type="module">
    import {
      auth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      googleProvider,
      signInWithPopup,
      getAdditionalUserInfo
    } from "/assets/js/firebase.js";

    const form = document.querySelector("#authForm");
    const title = document.querySelector("#title");
    const subtitle = document.querySelector("#subtitle");
    const submitButton = document.querySelector("#submitButton");
    const modeButton = document.querySelector("#modeButton");
    const googleButton = document.querySelector("#googleButton");
    const googleText = document.querySelector("#googleText");
    const message = document.querySelector("#message");

    let signupMode = false;
    let suppressAutoRoute = false;

    onAuthStateChanged(auth, async user => {
      if (!user || suppressAutoRoute) return;
      await routeAuthenticatedUser(user);
    });

    function setMessage(text, error = false) {
      message.textContent = text;
      message.dataset.error = error ? "true" : "false";
    }

    async function routeAuthenticatedUser(user) {
      try {
        const token = await user.getIdToken();
        const response = await fetch("/api/user", {
          headers: { Authorization: `Bearer ${token}` },
          cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.configured) {
          location.replace("/dashboard/");
          return;
        }
        location.replace("/onboarding/");
      } catch {
        location.replace("/onboarding/");
      }
    }

    function updateMode() {
      if (signupMode) {
        title.textContent = "Create your account";
        subtitle.textContent = "Create your JSON Mail account to get started.";
        submitButton.textContent = "Create account";
        modeButton.textContent = "Already have an account? Sign in";
        googleText.textContent = "Sign up with Google";
      } else {
        title.textContent = "Welcome back";
        subtitle.textContent = "Sign in to manage your SMTP connection and email API.";
        submitButton.textContent = "Sign in";
        modeButton.textContent = "Create an account";
        googleText.textContent = "Continue with Google";
      }
      setMessage("");
    }

    modeButton.addEventListener("click", () => {
      signupMode = !signupMode;
      updateMode();
    });

    googleButton.addEventListener("click", async () => {
      suppressAutoRoute = true;
      googleButton.disabled = true;
      submitButton.disabled = true;
      modeButton.disabled = true;
      const previousGoogleText = googleText.textContent;
      googleText.textContent = signupMode ? "Signing up…" : "Signing in…";
      setMessage(signupMode ? "Creating your account…" : "Signing in with Google…");

      try {
        const result = await signInWithPopup(auth, googleProvider);
        const isNewUser = Boolean(getAdditionalUserInfo(result)?.isNewUser);
        if (isNewUser) {
          location.replace("/onboarding/");
        } else {
          await routeAuthenticatedUser(auth.currentUser);
        }
      } catch (error) {
        const code = error?.code || "";
        const friendly = {
          "auth/popup-closed-by-user": "Google sign-in was cancelled.",
          "auth/popup-blocked": "Your browser blocked the Google sign-in popup.",
          "auth/account-exists-with-different-credential":
            "An account already exists with this email using a different sign-in method."
        }[code] || error.message || "Google sign-in failed.";
        setMessage(friendly, true);
        suppressAutoRoute = false;
      } finally {
        googleButton.disabled = false;
        submitButton.disabled = false;
        modeButton.disabled = false;
        googleText.textContent = previousGoogleText;
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      suppressAutoRoute = true;
      submitButton.disabled = true;
      googleButton.disabled = true;
      modeButton.disabled = true;

      const previousSubmitText = submitButton.textContent;
      submitButton.textContent = signupMode ? "Creating account…" : "Signing in…";
      setMessage(signupMode ? "Creating account…" : "Signing in…");

      try {
        const email = document.querySelector("#email").value.trim();
        const password = document.querySelector("#password").value;

        if (signupMode) {
          await createUserWithEmailAndPassword(auth, email, password);
          location.replace("/onboarding/");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          await routeAuthenticatedUser(auth.currentUser);
        }
      } catch (error) {
        const code = error?.code || "";
        const friendly = {
          "auth/invalid-credential": "Invalid email or password.",
          "auth/wrong-password": "Invalid email or password.",
          "auth/user-not-found": "No account was found with this email.",
          "auth/email-already-in-use": "That email is already registered. Sign in instead.",
          "auth/weak-password": "Password must be at least 6 characters.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/too-many-requests": "Too many attempts. Please try again later."
        }[code] || error.message || "Authentication failed.";

        setMessage(friendly, true);
        suppressAutoRoute = false;
      } finally {
        submitButton.disabled = false;
        googleButton.disabled = false;
        modeButton.disabled = false;
        submitButton.textContent = previousSubmitText;
      }
    });

    updateMode();
  </script>
</body>
</html>

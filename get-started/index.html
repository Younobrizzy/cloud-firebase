<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Get Started · Cloud Firebase</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/get-started.css">
</head>
<body>
  <main class="page">
    <section class="get-started" aria-labelledby="pageTitle">
      <div class="brand" aria-label="Cloud Firebase">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <span class="brand-title">Cloud Firebase</span>
      </div>

      <div class="content">
        <div class="eyebrow">You’re signed in</div>
        <h1 id="pageTitle">Get started</h1>
        <p class="intro">Choose a tool to continue.</p>

        <div class="account-pill" aria-live="polite">
          <span class="account-dot" aria-hidden="true"></span>
          <span id="userEmail">Checking account…</span>
        </div>

        <div class="tool-buttons" aria-label="Cloud Firebase tools">
          <button class="tool-button" id="firestoreButton" type="button">Firestore</button>
          <button class="tool-button" id="formatterButton" type="button">Formatter</button>
        </div>

        <button class="secondary-button" id="logoutButton" type="button">Sign out</button>
      </div>
    </section>
  </main>

  <script type="module" src="/assets/js/get-started.js"></script>
</body>
</html>
